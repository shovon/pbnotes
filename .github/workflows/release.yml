# A pushed vX.Y.Z tag becomes a draft GitHub Release with the macOS build
# attached; someone publishes it by hand after checking it (#68). Started by
# hand instead, it builds without publishing and keeps the bundle as a run
# artifact, to test the workflow without cutting a tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # assets/icon.icon is compiled by actool, which needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $version"
            exit 1
          fi

      # Node 24 and up: `npm run package` exits 0 without writing a bundle.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # app and packages/* share the root lockfile.
      - run: npm ci

      # A dry run makes the bundle and records what to upload, so the check
      # below runs before anything reaches GitHub.
      - name: Build for release
        if: github.event_name == 'push'
        run: npm run publish -w app -- --dry-run

      - name: Build
        if: github.event_name != 'push'
        run: npm run make -w app

      # Forge has exited 0 without a bundle before; trust the files, not the code.
      - name: Bundle exists
        run: |
          find app/out/make -name '*.dmg' -o -name '*.zip' | grep . || {
            echo "::error::No .dmg or .zip under app/out/make"
            exit 1
          }

      - name: Publish a draft Release
        if: github.event_name == 'push'
        run: npm run publish -w app -- --from-dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          gh release edit "$GITHUB_REF_NAME" --notes "$notes

          The app is not signed with a Developer ID yet, so macOS will refuse to open it the first time. See [how to allow it to open](https://github.com/$GITHUB_REPOSITORY#install)."

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: pbnotes-macos
          path: app/out/make
