# A pushed vX.Y.Z tag becomes a draft GitHub Release with the macOS build, the
# Windows installers and the Linux packages attached; someone publishes it by
# hand after checking it (#68, #348, #356). Started by hand instead, it builds without publishing and
# keeps each platform's files as a run artifact, to test the workflow without
# cutting a tag.
#
# Each platform builds in a job of its own and hands its files on as an
# artifact. One last job makes the draft from all of them, so two jobs never
# race to make it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # assets/icon.icon is compiled by actool, which needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # app and packages/* share the root lockfile.
      - run: npm ci

      - name: Build
        run: npm run make -w app

      # Forge has exited 0 without a bundle before; trust the files, not the
      # code. The DMG is the download people expect; the ZIP is what
      # auto-update would consume later (#67).
      - name: Collect the bundles
        run: |
          mkdir dist
          find app/out/make \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} dist/ \;
          ls dist/*.dmg dist/*.zip || {
            echo "::error::No .dmg and .zip under app/out/make"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: pbnotes-macos
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # One Squirrel installer per CPU: x64, which most Windows PCs are, and
      # arm64. The app has no native modules of its own (`node:sqlite` is
      # Electron's), so one machine packages both. One after the other:
      # `--arch=x64,arm64` makes both at once, and their Squirrel steps
      # collide over the same temporary .nupkg (EBUSY).
      - name: Build
        run: |
          npm run make -w app -- --arch=x64
          npm run make -w app -- --arch=arm64

      # Both installers are called "Pb Notes-<version> Setup.exe", and one
      # Release cannot hold two files of one name, so each gets its CPU in its
      # name. Only the installers: Squirrel's .nupkg and RELEASES are for
      # auto-update, which there is none of yet (#67).
      - name: Collect the installers
        run: |
          version=$(node -p "require('./app/package.json').version")
          mkdir dist
          for arch in x64 arm64; do
            setup="app/out/make/squirrel.windows/$arch/Pb Notes-$version Setup.exe"
            [ -f "$setup" ] || {
              echo "::error::No installer for $arch at $setup"
              exit 1
            }
            cp "$setup" "dist/Pb Notes-$version-$arch-Setup.exe"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pbnotes-windows
          path: dist/
          if-no-files-found: error

  linux:
    # Each CPU builds on a runner of its own rather than cross-building, so
    # each runner can install and start what it built (#356). Both on 24.04,
    # whose AppArmor limits on sandboxes are the ones Ubuntu users have.
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The RPM maker runs `rpmbuild`, and the AppImage maker `mksquashfs`;
      # the runner has dpkg and fakeroot for the .deb already.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools

      - name: Build
        run: npm run make -w app

      # The makers already put the CPU in each name: the .deb and .rpm the way
      # each distro spells it (pbnotes_<version>_amd64.deb,
      # pbnotes-<version>-1.x86_64.rpm), the AppImage as the Windows installers
      # do ("Pb Notes-<version>-x64.AppImage").
      - name: Collect the packages
        run: |
          shopt -s nullglob
          debs=(app/out/make/deb/*/*.deb)
          rpms=(app/out/make/rpm/*/*.rpm)
          appimages=(app/out/make/AppImage/*/*.AppImage)
          [ ${#debs[@]} -eq 1 ] && [ ${#rpms[@]} -eq 1 ] && [ ${#appimages[@]} -eq 1 ] || {
            echo "::error::Expected one .deb, one .rpm and one AppImage under app/out/make, found: ${debs[*]} ${rpms[*]} ${appimages[*]}"
            exit 1
          }
          mkdir dist
          cp "${debs[0]}" "${rpms[0]}" "${appimages[0]}" dist/
          ls -l dist

      # Installed the way a user would, then started on a virtual screen. The
      # app's code is the same on both CPUs; this is for packaging mistakes.
      - name: Smoke-test the .deb
        run: |
          sudo apt-get install -y xvfb x11-utils ./dist/*.deb
          cat /usr/share/applications/pbnotes.desktop
          grep -qx 'StartupWMClass=pbnotes' /usr/share/applications/pbnotes.desktop
          app/scripts/smoke-launch.sh pbnotes

      # Run as a user would run it, so it mounts itself with FUSE. Twice: with
      # Ubuntu's block on unprivileged user namespaces, where it can only start
      # if its launch script drops the sandbox, and without it, where it keeps
      # the sandbox (#357).
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get install -y fuse3
          appimage=$(echo dist/*.AppImage)
          chmod +x "$appimage"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          app/scripts/smoke-launch.sh "$appimage"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          app/scripts/smoke-launch.sh "$appimage"

      # In a Fedora container, as a user who isn't root: Electron won't run as
      # root without --no-sandbox. The .rpm's sandbox relies on unprivileged
      # user namespaces, which Fedora allows; the runner's Ubuntu kernel and
      # Docker's defaults don't, so both are lifted for the container.
      - name: Smoke-test the .rpm
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/w:ro" fedora:latest bash -euc '
              dnf install -y /w/dist/*.rpm xorg-x11-server-Xvfb xwininfo util-linux
              useradd -m tester
              runuser -u tester -- /w/app/scripts/smoke-launch.sh pbnotes
            '

      - uses: actions/upload-artifact@v4
        with:
          name: pbnotes-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  arch:
    # Pacman packages for Arch and Omarchy (#361), for both CPUs, made from
    # the linux jobs' .deb files: the PKGBUILD only unpacks a .deb, and makepkg
    # uses a source file that is already in place. Both are built on x64, in
    # the official Arch image, which is x86_64 only; telling makepkg the
    # target CPU (CARCH) gives the same aarch64 package an ARM machine would.
    # Only the x64 one can be installed and started here.
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pbnotes-linux-*
          path: debs
          merge-multiple: true

      # The sandbox needs unprivileged user namespaces, as the .rpm's test
      # does: Arch allows them, the runner's Ubuntu kernel and Docker don't.
      - name: Build and smoke-test the Arch packages
        run: |
          version=$(node -p "require('./app/package.json').version")
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir dist
          docker run --rm -e version="$version" \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/w:ro" -v "$PWD/dist:/out" archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed namcap xorg-server-xvfb xorg-xwininfo
              useradd -m builder
              # The PKGBUILD reads ../package.json and ../../LICENSE.
              repo=/home/builder/repo
              mkdir -p "$repo/app"
              cp -r /w/app/arch /w/app/package.json "$repo/app/"
              cp /w/LICENSE "$repo/"
              pkg="$repo/app/arch"
              cp "/w/debs/pbnotes_${version}_amd64.deb" "$pkg/pbnotes-$version-x86_64.deb"
              cp "/w/debs/pbnotes_${version}_arm64.deb" "$pkg/pbnotes-$version-aarch64.deb"
              sed "s/^CARCH=.*/CARCH=\"aarch64\"/" /etc/makepkg.conf > /etc/makepkg-aarch64.conf
              chown -R builder "$repo"
              cd "$pkg"
              pacman -S --noconfirm --needed $(source PKGBUILD && echo "${depends[@]}")
              runuser -u builder -- makepkg --noconfirm
              runuser -u builder -- makepkg --noconfirm --config /etc/makepkg-aarch64.conf
              x64=$(echo pbnotes-bin-*-x86_64.pkg.tar.*)
              arm64=$(echo pbnotes-bin-*-aarch64.pkg.tar.*)
              [ -f "$x64" ] && [ -f "$arm64" ]
              # namcap marks errors with " E: ".
              namcap PKGBUILD "$x64" | tee namcap.log
              if grep -q " E: " namcap.log; then exit 1; fi
              pacman -U --noconfirm "$x64"
              runuser -u builder -- /w/app/scripts/smoke-launch.sh pbnotes
              cp "$x64" "$arm64" /out/
            '
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pbnotes-arch
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [macos, windows, linux, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pbnotes-*
          path: dist
          merge-multiple: true

      - name: Publish a draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes

          The app is not signed yet, so macOS and Windows both warn the first time it opens. See [how to allow it to open](https://github.com/$GITHUB_REPOSITORY#install)."
